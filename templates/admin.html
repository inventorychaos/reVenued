<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – {{ event }}</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;background:#f4f6fa;margin:0;padding:20px}
  .wrap{max-width:1100px;margin:auto}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input{padding:9px;border:1px solid #ccd;border-radius:8px;font-size:1rem}
  button,a.btn{padding:8px 12px;border:0;border-radius:8px;background:#2f5bea;color:#fff;cursor:pointer;font-size:.9rem;text-decoration:none}
  button.sec{background:#667}
  .stats{display:flex;gap:12px;margin-bottom:14px}
  .stat{background:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 1px 6px #0001}
  .stat b{font-size:1.5rem;display:block}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #eef;font-size:.9rem;white-space:nowrap}
  .in{color:#0b6b2a;font-weight:600}.out{color:#999}
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin: {{ event }}</h1>
  <div class="bar">
    <input id="key" type="password" placeholder="Admin key">
    <input id="q" placeholder="Search name / email / org">
    <button id="csv" class="sec">Export CSV</button>
    <a class="btn" href="/scanner">Open scanner</a>
  </div>
  <div class="stats">
    <div class="stat"><b id="s-total">0</b>Registered</div>
    <div class="stat"><b id="s-in">0</b>Checked in</div>
    <div class="stat"><b id="s-fail">0</b>Email failed</div>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Name</th><th>Email</th><th>Organization</th><th>Phone</th><th>Registered</th><th>Status</th><th>Email</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div>
<script>
const keyEl = document.getElementById('key'), q = document.getElementById('q');
keyEl.value = localStorage.getItem('adminKey') || '';
keyEl.addEventListener('change', () => { localStorage.setItem('adminKey', keyEl.value); load(); });
q.addEventListener('input', render);
const H = () => ({'X-Admin-Key': keyEl.value});
let data = [];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  const r = await fetch('/api/attendees', {headers: H()});
  if (!r.ok) { document.getElementById('rows').innerHTML = '<tr><td colspan="8">Enter the correct admin key.</td></tr>'; return; }
  data = await r.json(); render();
}
function render() {
  const t = q.value.toLowerCase();
  const list = data.filter(a => !t || [a.full_name, a.email, a.organization].join(' ').toLowerCase().includes(t));
  document.getElementById('s-total').textContent = data.length;
  document.getElementById('s-in').textContent = data.filter(a => a.checked_in).length;
  document.getElementById('s-fail').textContent = data.filter(a => a.email_status.startsWith('failed')).length;
  document.getElementById('rows').innerHTML = list.map(a => `<tr>
    <td>${esc(a.full_name)}</td><td>${esc(a.email)}</td><td>${esc(a.organization)}</td><td>${esc(a.phone)}</td>
    <td>${esc(a.registered_at)}</td>
    <td class="${a.checked_in ? 'in' : 'out'}">${a.checked_in ? 'Checked in ' + esc(a.checked_in_at) : 'Not yet'}</td>
    <td title="${esc(a.email_status)}">${esc(a.email_status.split(':')[0])}</td>
    <td><button onclick="resend(${a.id})">Resend</button>
        ${a.checked_in ? '' : `<button class="sec" onclick="manual(${a.id})">Check in</button>`}</td></tr>`).join('');
}
async function resend(id) {
  const r = await fetch('/api/resend/' + id, {method:'POST', headers: H()});
  const j = await r.json(); alert(j.ok ? 'Email: ' + j.email_status.split(':')[0] : 'Failed: ' + j.email_status); load();
}
async function manual(id) {
  if (!confirm('Check in without a QR scan?')) return;
  await fetch('/api/manual-checkin/' + id, {method:'POST', headers: H()}); load();
}
document.getElementById('csv').onclick = async () => {
  const r = await fetch('/api/attendees.csv', {headers: H()});
  if (!r.ok) return alert('Wrong admin key');
  const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = 'attendees.csv'; a.click();
};
load(); setInterval(load, 10000);
</script>
</body>
</html>
