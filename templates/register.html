<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register – {{ event }}</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;background:#f4f6fa;margin:0;padding:24px}
  .card{max-width:440px;margin:auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 12px #0001}
  h1{margin:0 0 4px;font-size:1.4rem} p.sub{color:#667;margin:0 0 20px}
  label{display:block;font-weight:600;margin-top:14px;font-size:.9rem}
  input{width:100%;box-sizing:border-box;padding:10px;margin-top:4px;border:1px solid #ccd;border-radius:8px;font-size:1rem}
  .err{color:#c0392b;font-size:.82rem;min-height:1em}
  button{margin-top:22px;width:100%;padding:12px;font-size:1rem;border:0;border-radius:8px;background:#2f5bea;color:#fff;cursor:pointer}
  button:disabled{opacity:.6}
  #done{display:none;text-align:center} #done img{width:220px;height:220px}
</style>
</head>
<body>
<div class="card">
  <form id="f" novalidate>
    <h1>{{ event }}</h1><p class="sub">Register to receive your QR ticket by email.</p>
    <label>Full Name<input name="full_name" required autocomplete="name"></label><div class="err" data-for="full_name"></div>
    <label>Email Address<input name="email" type="email" required autocomplete="email"></label><div class="err" data-for="email"></div>
    <label>Organization<input name="organization" required autocomplete="organization"></label><div class="err" data-for="organization"></div>
    <label>Contact Number<input name="phone" type="tel" required autocomplete="tel"></label><div class="err" data-for="phone"></div>
    <button id="btn">Register</button>
    <div class="err" id="general"></div>
  </form>
  <div id="done">
    <h1>You're registered!</h1>
    <p id="msg"></p>
    <img id="qr" alt="Your QR ticket">
  </div>
</div>
<script>
const f = document.getElementById('f'), btn = document.getElementById('btn');
f.addEventListener('submit', async e => {
  e.preventDefault();
  document.querySelectorAll('.err').forEach(x => x.textContent = '');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await fetch('/register', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.fromEntries(new FormData(f)))});
    const j = await r.json();
    if (!j.ok) {
      for (const [k,v] of Object.entries(j.errors||{})) (document.querySelector(`[data-for="${k}"]`) || document.getElementById('general')).textContent = v;
      return;
    }
    f.style.display = 'none';
    document.getElementById('done').style.display = 'block';
    document.getElementById('qr').src = '/ticket/' + j.token + '.png';
    document.getElementById('msg').textContent = j.email_status === 'sent'
      ? 'A confirmation email with your QR ticket is on its way.'
      : j.email_status.startsWith('failed') ? 'Email could not be sent, please save this QR code.'
      : 'Email delivery is not configured yet (dev mode). Save this QR code.';
  } catch (err) {
    document.getElementById('general').textContent = 'Network error, please try again.';
  } finally { btn.disabled = false; btn.textContent = 'Register'; }
});
</script>
</body>
</html>
